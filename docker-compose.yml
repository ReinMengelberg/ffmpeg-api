services:
  mp3-converter:
    image: ghcr.io/reinmengelberg/ffmpeg-api:latest   # pin to a sha-xxxxxxx tag for reproducible deploys
    restart: unless-stopped
    environment:
      - API_KEY=${SERVICE_PASSWORD_MP3}   # Coolify generates this; copy it into n8n's Header Auth credential
      - MAX_BYTES=2147483648
      - FFMPEG_TIMEOUT_S=1800
    read_only: true
    tmpfs:
      - /tmp:size=4g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
